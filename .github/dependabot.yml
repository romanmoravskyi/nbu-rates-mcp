version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      mcp:
        patterns: ["@modelcontextprotocol/*", "zod"]
      dev-tooling:
        patterns: ["typescript", "vitest", "@biomejs/biome", "tsx", "@types/node"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
